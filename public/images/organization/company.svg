    <g stroke="#FEF5EA" stroke-width="30">
      <polyline points="170,540 285,470 360,500 580,255"/>
      <polyline points="538,263 580,255 577,298"/>
    </g>
    <g stroke="#E8963A" stroke-width="16">
      <polyline points="170,540 285,470 360,500 580,255"/>
      <polyline points="538,263 580,255 577,298"/>
    </g>
  </g>

  <!-- bitcoin coin -->
  <!-- official Bitcoin logo (64×64) scaled to r≈52 -->
  <g transform="translate(586 144) scale(1.625)">
    <path fill="#F7931A" d="M63.04 39.741c-4.274 17.143-21.638 27.575-38.783 23.301C7.12 58.768-3.313 41.404.962 24.262 5.234 7.117 22.597-3.317 39.737.957c17.144 4.274 27.576 21.64 23.302 38.784z"/>
