      <rect x="484" y="254" width="18" height="20" rx="3"/><rect x="516" y="254" width="18" height="20" rx="3"/><rect x="548" y="254" width="18" height="20" rx="3"/>
      <rect x="484" y="288" width="18" height="20" rx="3"/><rect x="516" y="288" width="18" height="20" rx="3"/><rect x="548" y="288" width="18" height="20" rx="3"/>
      <rect x="484" y="322" width="18" height="20" rx="3"/><rect x="516" y="322" width="18" height="20" rx="3"/><rect x="548" y="322" width="18" height="20" rx="3"/>
      <rect x="484" y="356" width="18" height="20" rx="3"/><rect x="516" y="356" width="18" height="20" rx="3"/><rect x="548" y="356" width="18" height="20" rx="3"/>
      <rect x="484" y="390" width="18" height="20" rx="3"/><rect x="516" y="390" width="18" height="20" rx="3"/><rect x="548" y="390" width="18" height="20" rx="3"/>
      <rect x="484" y="424" width="18" height="20" rx="3"/><rect x="516" y="424" width="18" height="20" rx="3"/><rect x="548" y="424" width="18" height="20" rx="3"/>
