    <g>
      <rect x="361" y="354" width="20" height="20" rx="3"/><rect x="395" y="354" width="20" height="20" rx="3"/><rect x="429" y="354" width="20" height="20" rx="3"/>
      <rect x="361" y="388" width="20" height="20" rx="3"/><rect x="395" y="388" width="20" height="20" rx="3"/><rect x="429" y="388" width="20" height="20" rx="3"/>
      <rect x="361" y="422" width="20" height="20" rx="3"/><rect x="395" y="422" width="20" height="20" rx="3"/><rect x="429" y="422" width="20" height="20" rx="3"/>
      <rect x="361" y="456" width="20" height="20" rx="3"/><rect x="395" y="456" width="20" height="20" rx="3"/><rect x="429" y="456" width="20" height="20" rx="3"/>
      <rect x="361" y="490" width="20" height="20" rx="3"/><rect x="395" y="490" width="20" height="20" rx="3"/><rect x="429" y="490" width="20" height="20" rx="3"/>
    </g>
