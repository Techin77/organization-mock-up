<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Bitcoin Company — สไตล์เดียวกับ family-office.png / merchant.png -->
  <rect width="800" height="800" fill="#FEF5EA"/>

  <!-- decorative arcs -->
  <g fill="none" stroke-linecap="round">
    <circle cx="-20" cy="820" r="300" stroke="#FBE8D4" stroke-width="56"/>
    <circle cx="820" cy="-20" r="230" stroke="#FBE8D4" stroke-width="56"/>
    <path d="M610 770 A150 150 0 0 1 780 640" stroke="#F8DCBD" stroke-width="14"/>
  </g>

  <!-- coin halo -->
  <circle cx="638" cy="196" r="72" fill="#FBE3C6"/>

  <!-- towers (rising left → right) -->
  <g fill="#1B2A41">
    <rect x="230" y="430" width="110" height="210" rx="8"/>
    <rect x="345" y="330" width="120" height="310" rx="8"/>
    <rect x="470" y="230" width="110" height="410" rx="8"/>
    <rect x="500" y="206" width="50" height="34" rx="6"/>
    <rect x="522" y="168" width="6" height="42" rx="3"/>
    <rect x="200" y="636" width="420" height="16" rx="8"/>
  </g>

