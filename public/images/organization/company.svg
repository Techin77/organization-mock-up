    <g>
      <rect x="244" y="454" width="18" height="20" rx="3"/><rect x="276" y="454" width="18" height="20" rx="3"/><rect x="308" y="454" width="18" height="20" rx="3"/>
      <rect x="244" y="488" width="18" height="20" rx="3"/><rect x="276" y="488" width="18" height="20" rx="3"/><rect x="308" y="488" width="18" height="20" rx="3"/>
      <rect x="244" y="522" width="18" height="20" rx="3"/><rect x="276" y="522" width="18" height="20" rx="3"/><rect x="308" y="522" width="18" height="20" rx="3"/>
    </g>
