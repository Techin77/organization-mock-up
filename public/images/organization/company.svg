  </g>

  <!-- people (front) -->
  <g stroke="#FEF5EA" stroke-width="8" paint-order="stroke">
    <g fill="#1B2A41">
      <circle cx="320" cy="560" r="21"/>
      <path d="M288 652 V620 a32 32 0 0 1 64 0 V652 Z"/>
      <circle cx="490" cy="560" r="21"/>
      <path d="M458 652 V620 a32 32 0 0 1 64 0 V652 Z"/>
    </g>
    <circle cx="405" cy="540" r="25" fill="#1B2A41"/>
    <path d="M366 652 V615 a39 39 0 0 1 78 0 V652 Z" fill="#E8963A"/>
  </g>
